[project]
name = "noor-islamic-assistant"
version = "0.1.0"
description = "A source-grounded Islamic knowledge chatbot in English and Hindi"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.34,<1", "httpx>=0.28,<1"]

[dependency-groups]
deploy = [
    "huggingface-hub>=1,<2",
]
dev = [
    "lm-format-enforcer==0.11.3",
    "pytest>=8,<10",
    "pytest-asyncio>=0.25,<2",
]
free-ui = [
    "gradio==6.30.0",
    "lm-format-enforcer==0.11.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["."]
